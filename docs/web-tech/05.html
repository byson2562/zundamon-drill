Iサーバーの設定で、Access-Control-Allow-Origin にそのオリジンを許可する"], "answer": 3, "explain": "CORSの許可ヘッダ（Access-Control-Allow-Origin）を返すのはAPI側の役目です。あのエラーは「API側があなたのオリジンを許可リストに入れていない」という意味なので、直す場所はブラウザでもSPAのコードでもなく、APIサーバーの設定です。", "ref": "5.5"}, {"type": "essay", "q": "後輩に「同一オリジンポリシーって、正当なAPI呼び出しまでブロックして不便なだけじゃないですか？ なんであるんですか？」と聞かれた。3文くらいで説明してみよう。", "model": "同一オリジンポリシーは「ページ上のJavaScriptは、そのページと同じオリジンにしか自由にリクエストできない」というブラウザの防御線です。これがないと、悪意あるサイトを開いただけで、そのページのJavaScriptがあなたのCookie付きで銀行サイトのAPIを呼び放題になってしまいます（Cookieはブラウザが自動で添付するからです）。正当な別オリジンの呼び出しは、API側がCORSのヘッダで許可を出すという正式な通用口を通して行います。", "points": ["JavaScriptは同じオリジンにしか自由にリクエストできない、という内容に触れた", "Cookieが自動添付されるため、ないと他サイトのAPIを勝手に呼べてしまう危険に触れた", "正当な呼び出しはCORS（API側が許可ヘッダを返す）で通すことに触れた"], "ref": "5.5"}], "chapter_url": "https://zenn.dev/bonobono/books/zundamon-web-tech/viewer/web-api-spa"}</script>
