pe": "essay", "q": "後輩に「URLとHTTPとHTMLって、何がどう違うんですか？」と聞かれた。宅配の注文などの比喩を使って、3文くらいで説明してみよう。", "model": "URLは「欲しいものがどこにあるか」を指す住所で、HTTPは「その住所からどうやって取り寄せるか」を決めた会話のルール、HTMLは「届いた中身をどう表現するか」の形式です。宅配にたとえると、住所（URL）に注文のルール（HTTP）で頼むと、品物（HTML）が届く、という構図になります。この3つはどの言語・フレームワークを使っても床下で動いている共通の土台なので、ここを押さえると特定の道具に縛られない知識になります。", "points": ["URL＝どこにあるか（住所）に触れた", "HTTP＝どうやって取り寄せるか（会話のルール・プロトコル）に触れた", "HTML＝中身をどう表現するか（形式）に触れた", "言語やフレームワークによらない共通の土台であることに触れた"], "ref": "1.2"}], "chapter_url": "https://zenn.dev/bonobono/books/zundamon-web-tech/viewer/what-is-web"}</script>
