。可用性はTLSの守備範囲ではなく、8章やSREシリーズの話題です。", "ref": "7.4"}, {"type": "essay", "q": "守りの定石にある「Cookieは3点セット：HttpOnly・Secure・SameSite=Lax 以上」。それぞれの属性がどの攻撃・危険から守ってくれるのか、後輩に説明してみよう。", "model": "HttpOnly はJavaScriptからCookieを読めなくする属性で、XSSが刺さってもCookie（セッションID）の横取りの被害を限定します。Secure はHTTPSの通信でしかCookieを送らない属性で、カフェのWi-Fiのような平文の経路でセッションIDが盗聴されるのを防ぎます。SameSite=Lax はよそのサイト発のPOSTにCookieを添付しない属性で、本人のブラウザに正規の形のリクエストを撃たせるCSRFへの防壁になります。", "points": ["HttpOnly：JavaScriptから読めない → XSSによるCookie横取りの被害を限定、に触れた", "Secure：HTTPSでしか送らない → 平文経路での盗聴を防ぐ、に触れた", "SameSite=Lax：よそのサイト発のPOSTに添付しない → CSRFの防壁、に触れた"], "ref": "7.2〜7.5"}], "chapter_url": "https://zenn.dev/bonobono/books/zundamon-web-tech/viewer/web-security"}</script>
