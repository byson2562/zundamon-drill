r": 2, "explain": "コンテナは三層構造の各部品が規格化された荷箱になったものです。台数を増やすのも、壊れたら捨てて新品に替えるのも、開発と本番の環境を揃えるのも簡単になります。荷箱の大群を管理するのがKubernetes、置き場と周辺設備をコードで宣言するのがTerraformです。", "ref": "8.4"}, {"type": "essay", "q": "スマホのブラウザで https://zunda-order.example/item?id=z01 を開いてから、商品ページのHTMLが届くまでに何が起きるか。DNS・TLS・CDN・ロードバランサ・三層構造の登場順に、4〜5文で実況してみよう。", "model": "まずブラウザが zunda-order.example の住所をDNSに聞き、CDNの住所を受け取ります。次にCDNの拠点とTLSのハンドシェイクをして、証明書で相手が本物だと確認し、以後の会話を暗号化します。GET /item?id=z01 を送ると、画像やCSSはCDNのキャッシュが近所から返し、HTML本体はキャッシュ不可なので奥へ回されます。入口のリバースプロキシ兼ロードバランサが、ヘルスチェック済みのAPサーバーに振り分けます。APサーバーのアプリがルーティングで処理を選び、DBから在庫を取り、テンプレートに流し込んでHTMLを返します。", "points": ["DNSで名前から住所（CDN）を引くことに触れた", "TLSのハンドシェイクと証明書による本物確認・暗号化に触れた", "画像やCSSはCDNのキャッシュが返し、HTML本体は奥へ回ることに触れた", "ロードバランサがヘルスチェック済みのAPサーバーに振り分けることに触れた", "APサーバーの「ルーティング→DB→テンプレート」の3段に触れた"], "ref": "8.1〜8.5"}], "chapter_url": "https://zenn.dev/bonobono/books/zundamon-web-tech/viewer/web-system-architecture"}</script>
