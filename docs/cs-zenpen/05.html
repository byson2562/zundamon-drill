in": "「この言語は遅い/速い」は正確には処理系の話です。この解像度を持っていると、性能の議論で雰囲気に流されません。実務では「Python で書くが、重い計算は C 実装のライブラリに任せる」合わせ技が定番です。", "ref": "5.4"}, {"type": "essay", "q": "後輩に「データベースがメモリに載っているかどうかで、なんで速度が桁で変わるんですか？」と聞かれた。メモリ階層の話を使って、3文くらいで説明してみよう。", "model": "記憶装置には桁違いの速度差があり、レジスタへのアクセスを1秒とすると、メインメモリは数分、SSD は数日、HDD は数か月に相当します。データがメモリに載っていれば「数分の外出」で済みますが、ディスクまで取りに行くと「長期出張」になるので、応答時間が桁で変わります。だから性能の勝負は計算の速さより「データがどの階にあるか」で決まることが多く、Redis のようなインメモリキャッシュを挟むのもこのためです。", "points": ["記憶装置に桁違いの階層（速度差）があることに触れた", "メモリとディスクのアクセス時間の差を具体的に比較した", "「データがどの階にあるか」が性能を決めるという結論に触れた"], "ref": "5.1〜5.2"}], "chapter_url": "https://zenn.dev/bonobono/books/zundamon-cs-zenpen/viewer/memory-and-execution"}</script>
