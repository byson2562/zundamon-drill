リソースの詳細が見られます。rm や mv のように state を書き換えるサブコマンドもありますが、入門の段階では読む系の list と show だけ使いましょう。", "ref": "4.5"}, {"type": "essay", "q": "「ドリフト」とは何か、なぜ困るのか、どう防ぐのかを説明してみよう。", "model": "ドリフトは、コンソールでの手動変更などによって、コードと実環境がズレることです。Terraform はコードを正しいものとして扱うので、手動で直した設定は次の apply で黙って巻き戻され、障害対応で直した設定が消えて再発する、といった事故が起きます。防ぐには、Terraform 管理のリソースへの変更は必ずコードを変えて plan / apply で行い、緊急時に手動変更したときは、できるだけ早くコードに反映します。", "points": ["コードと実環境のズレ（手動変更などで起きる）だと説明した", "次の apply で黙って巻き戻される危険に触れた", "変更は必ずコードを変えて plan / apply で行うことに触れた", "緊急時の手動変更は早くコードに反映することに触れた"], "ref": "4.3〜4.4"}], "chapter_url": "https://zenn.dev/bonobono/books/zundamon-terraform-nyumon/viewer/understanding-state"}</script>
